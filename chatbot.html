<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDF Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow">
          <div class="card-body">
            <h3 class="card-title text-center text-primary mb-4">PDF Chatbot</h3>

            <form id="chat-form" enctype="multipart/form-data">
              <div class="mb-3">
                <label for="pdf_file" class="form-label">Upload PDF:</label>
                <input class="form-control" type="file" id="pdf_file" name="pdf_file" accept=".pdf">
              </div>

              <div class="mb-3">
                <label for="user_query" class="form-label">Ask a Question:</label>
                <input type="text" class="form-control" id="user_query" name="user_query" placeholder="Type your question...">
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-primary">Ask</button>
              </div>
            </form>

            <div id="spinner" class="text-center mt-3 d-none">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
              <p class="text-muted small mt-2">Processing your request...</p>
            </div>

            <div id="response" class="alert alert-info mt-4 d-none" role="alert">
              <h5 class="mb-2">Answer:</h5>
              <pre id="answer-text" class="mb-0 text-dark" style="white-space: pre-wrap;"></pre>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS + dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const form = document.getElementById("chat-form");
    const spinner = document.getElementById("spinner");
    const responseBox = document.getElementById("response");
    const answerText = document.getElementById("answer-text");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      spinner.classList.remove("d-none");
      responseBox.classList.add("d-none");

      const formData = new FormData(form);
      try {
        const res = await fetch("", {
          method: "POST",
          body: formData
        });

        const data = await res.json();
        answerText.textContent = data.answer || data.error || "No answer found.";
        responseBox.classList.remove("d-none");
      } catch (error) {
        answerText.textContent = "Error: " + error.message;
        responseBox.classList.remove("d-none");
      } finally {
        spinner.classList.add("d-none");
      }
    });
  </script>

</body>
</html>
